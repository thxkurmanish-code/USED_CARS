[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dream-car-bazaar-api"
version = "0.1.0"
description = "FastAPI service for Dream Car Bazaar"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15.1",
  "email-validator>=2.2.0",
  "fastapi>=0.115.11",
  "PyJWT>=2.10.1",
  "pydantic-settings>=2.8.1",
  "pwdlib[argon2]>=0.2.1",
  "psycopg[binary]>=3.2.6",
  "sqlalchemy>=2.0.39",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
